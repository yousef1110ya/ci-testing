apiVersion: v1
kind: Service
metadata:
  name: ci-test-app
  namespace: ci-test
  labels:
    app: ci-test-app
spec:
  # ClusterIP is enough — reach it with `kubectl port-forward`, no ingress.
  type: ClusterIP
  selector:
    app: ci-test-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
