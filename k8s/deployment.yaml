apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-test-app
  namespace: ci-test
  labels:
    app: ci-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-test-app
  template:
    metadata:
      labels:
        app: ci-test-app
    spec:
      containers:
        - name: ci-test-app
          # Overridden by the CI pipeline via `kubectl set image`.
          image: ci-test-app:latest
          # Image is imported directly onto the node over SSH, so never try
          # to pull it from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
