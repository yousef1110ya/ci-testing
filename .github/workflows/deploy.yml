name: build-and-deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE: ci-test-app:${{ github.sha }}
  NAMESPACE: ci-test
  SSH_TARGET: ${{ secrets.NODE_USER }}@${{ secrets.NODE_HOST }}
  # kubeadm admin kubeconfig is root-owned; a non-interactive SSH session
  # doesn't source the user's profile, so point kubectl at it explicitly.
  KUBECTL: sudo kubectl --kubeconfig=/etc/kubernetes/admin.conf

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source from Codeberg (private repo)
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_PASSWORD: ${{ secrets.CODEBERG_PASSWORD }}
          CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}   # format: owner/repo
        run: |
          # Feed credentials via GIT_ASKPASS so they never appear on the
          # command line, in the remote URL, or in the build logs.
          cat > "$RUNNER_TEMP/askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            Username*) printf '%s' "$CODEBERG_USERNAME" ;;
            Password*) printf '%s' "$CODEBERG_PASSWORD" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/askpass.sh"

          # Clone into the (empty) workspace so later steps see the files at root.
          GIT_ASKPASS="$RUNNER_TEMP/askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git clone --depth 1 --branch master \
            "https://codeberg.org/${CODEBERG_REPO}.git" .

          rm -f "$RUNNER_TEMP/askpass.sh"

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Write SSH key and known_hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.NODE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.NODE_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Import image onto the node (containerd)
        run: |
          docker save "$IMAGE" \
            | ssh -i ~/.ssh/deploy_key "$SSH_TARGET" 'sudo ctr -n k8s.io images import -'

      - name: Create namespace
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" "$KUBECTL apply -f -" < k8s/namespace.yaml

      - name: Apply manifests
        run: |
          # Apply each manifest as its own stream. Concatenating them with cat
          # would merge the YAML docs (no `---` separator) and drop the Deployment.
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" "$KUBECTL -n $NAMESPACE apply -f -" < k8s/deployment.yaml
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" "$KUBECTL -n $NAMESPACE apply -f -" < k8s/service.yaml

      - name: Roll out new image
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" \
            "$KUBECTL -n $NAMESPACE set image deployment/ci-test-app ci-test-app=$IMAGE"
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" \
            "$KUBECTL -n $NAMESPACE rollout status deployment/ci-test-app --timeout=120s"

      - name: Remove SSH key
        if: always()
        run: shred -u ~/.ssh/deploy_key || true
